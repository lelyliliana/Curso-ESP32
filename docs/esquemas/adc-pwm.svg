<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="484" viewBox="0 0 1080 484" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Potenciómetro y salida PWM LEDC</title>
<desc id="descripcion">ESP32 3V3 — Extremo 1 — Potenciómetro 10 kΩ; GPIO34 / ADC1 — Cursor — Potenciómetro 10 kΩ; ESP32 GND — Extremo 2 — Potenciómetro 10 kΩ; GPIO25 — Resistencia 330 Ω — LED: A → K → GND.</desc>
<rect width="1080" height="484" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
<text x="32" y="40" class="title">Potenciómetro y salida PWM LEDC</text>
<text x="32" y="66" class="sub">CONEXIONES FUNCIONALES · ESP32 CLÁSICO / WROOM-32 · NO ES UNA VISTA FÍSICA DE PROTOBOARD</text>
<rect x="26" y="85" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="117" class="pin">ESP32 3V3</text>
<path d="M320 112 H675" fill="none" stroke="#b93828" stroke-width="3"/>
<circle cx="320" cy="112" r="4" fill="#b93828"/><circle cx="675" cy="112" r="4" fill="#b93828"/>
<rect x="355" y="98" width="285" height="28" rx="5" fill="#edf3f9" stroke="#b93828"/>
<text x="497" y="117" class="via" text-anchor="middle">Extremo 1</text>
<text x="696" y="117" class="pin">Potenciómetro 10 kΩ</text>
<rect x="26" y="151" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="183" class="pin">GPIO34 / ADC1</text>
<path d="M320 178 H675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="178" r="4" fill="#1477a2"/><circle cx="675" cy="178" r="4" fill="#1477a2"/>
<rect x="355" y="164" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="183" class="via" text-anchor="middle">Cursor</text>
<text x="696" y="183" class="pin">Potenciómetro 10 kΩ</text>
<rect x="26" y="217" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="249" class="pin">ESP32 GND</text>
<path d="M320 244 H675" fill="none" stroke="#485569" stroke-width="3"/>
<circle cx="320" cy="244" r="4" fill="#485569"/><circle cx="675" cy="244" r="4" fill="#485569"/>
<rect x="355" y="230" width="285" height="28" rx="5" fill="#edf3f9" stroke="#485569"/>
<text x="497" y="249" class="via" text-anchor="middle">Extremo 2</text>
<text x="696" y="249" class="pin">Potenciómetro 10 kΩ</text>
<rect x="26" y="283" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="315" class="pin">GPIO25</text>
<path d="M320 310 H675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="310" r="4" fill="#1477a2"/><circle cx="675" cy="310" r="4" fill="#1477a2"/>
<rect x="355" y="296" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="315" class="via" text-anchor="middle">Resistencia 330 Ω</text>
<text x="696" y="315" class="pin">LED: A → K → GND</text>
<text x="32" y="372" class="note">Las tres filas del potenciómetro representan la misma pieza. NO alimentarlo a 5 V.</text>
<text x="32" y="397" class="note">GPIO34 solo admite entrada en ESP32 clásico; la salida LEDC utiliza GPIO25.</text>
<text x="32" y="464" class="sub">Señal: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con el pinout real.</text></svg>