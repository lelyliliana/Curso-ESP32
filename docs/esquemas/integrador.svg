<text x="32" y="504" class="note">Pull-ups I2C a tensión compatible 3.3 V. Comprueba módulo y dirección 0x44.</text>
<text x="32" y="529" class="note">El LED responde al control remoto; el programa no lo enlaza a un umbral de temperatura.</text>
<text x="32" y="596" class="sub">Señal: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con el pinout real.</text></svg>