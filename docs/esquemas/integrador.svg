<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="616" viewBox="0 0 1080 616" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Integrador: SHT31, prioridad local y LED</title>
<desc id="descripcion">ESP32 3V3 — Alimentación compatible — Módulo SHT31 VCC; ESP32 GND — Referencia común — Módulo SHT31 GND; GPIO21 — SDA — Módulo SHT31 SDA; GPIO22 — SCL — Módulo SHT31 SCL; GPIO25 — Resistencia 330 Ω — LED: A → K → GND; GPIO27 — Contacto del botón — ESP32 GND.</desc>
<rect width="1080" height="616" fill="#f3f6fa"/>
