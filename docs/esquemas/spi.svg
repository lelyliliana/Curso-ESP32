<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="418" viewBox="0 0 1080 418" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">SPI loopback sin periférico</title>
<desc id="descripcion">GPIO23 / MOSI — ÚNICO PUENTE EXTERNO — GPIO19 / MISO; GPIO18 / SCK — Reloj configurado — Sin periférico conectado; GPIO26 / CS — Salida configurada — Sin periférico conectado.</desc>
<rect width="1080" height="418" fill="#f3f6fa"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#15263c}.title{font-size:24px;font-weight:bold}.sub{font-size:14px}.pin{font-size:17px;font-weight:bold}.via{font-size:14px}.note{font-size:15px}</style>
<text x="32" y="40" class="title">SPI loopback sin periférico</text>
<text x="32" y="66" class="sub">CONEXIONES FUNCIONALES · ESP32 CLÁSICO / WROOM-32 · NO ES UNA VISTA FÍSICA DE PROTOBOARD</text>
<rect x="26" y="85" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="117" class="pin">GPIO23 / MOSI</text>
<path d="M320 112 H675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="112" r="4" fill="#1477a2"/><circle cx="675" cy="112" r="4" fill="#1477a2"/>
<rect x="355" y="98" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="117" class="via" text-anchor="middle">ÚNICO PUENTE EXTERNO</text>
<text x="696" y="117" class="pin">GPIO19 / MISO</text>
<rect x="26" y="151" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="183" class="pin">GPIO18 / SCK</text>
<path d="M320 178 H675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="178" r="4" fill="#1477a2"/><circle cx="675" cy="178" r="4" fill="#1477a2"/>
<rect x="355" y="164" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="183" class="via" text-anchor="middle">Reloj configurado</text>
<text x="696" y="183" class="pin">Sin periférico conectado</text>
<rect x="26" y="217" width="1028" height="55" rx="9" fill="white"/>
<text x="42" y="249" class="pin">GPIO26 / CS</text>
<path d="M320 244 H675" fill="none" stroke="#1477a2" stroke-width="3"/>
<circle cx="320" cy="244" r="4" fill="#1477a2"/><circle cx="675" cy="244" r="4" fill="#1477a2"/>
<rect x="355" y="230" width="285" height="28" rx="5" fill="#edf3f9" stroke="#1477a2"/>
<text x="497" y="249" class="via" text-anchor="middle">Salida configurada</text>
<text x="696" y="249" class="pin">Sin periférico conectado</text>
<text x="32" y="306" class="note">Solo se instala el puente MOSI→MISO. CS cambia LOW/HIGH por código.</text>
<text x="32" y="331" class="note">La coincidencia A5 comprueba retorno local; no identifica ni lee un sensor SPI.</text>
<text x="32" y="398" class="sub">Señal: azul · Alimentación: rojo · Masa: gris. Montar sin alimentación y contrastar con el pinout real.</text></svg>